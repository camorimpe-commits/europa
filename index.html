<style>
  :root {
    --navy: #1a3a6b; --navy-light: #2a5298; --gold: #c8a84b; --gold-light: #f0d080;
    --cream: #faf8f3; --white: #ffffff; --gray-100: #f5f4f0; --gray-200: #e8e6e0;
    --gray-400: #9a9690; --gray-700: #4a4845; --gray-900: #1e1c1a; --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'DM Sans', sans-serif; background: var(--white); color: var(--gray-900); min-height: 100vh; display: flex; flex-direction: column; }
  
  /* Header */
  .app-header { background: var(--navy); color: white; padding: 15px 30px; display: flex; flex-direction: column; justify-content: center; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.1); }
  .app-header h1 { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 700; color: var(--gold-light); display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .app-header p { font-size: 12px; color: rgba(255,255,255,0.7); }
  
  /* City Nav (Com as Bandeiras) */
  .city-nav { display: flex; background: var(--white); padding: 0 20px; border-bottom: 1px solid var(--gray-200); overflow-x: auto; scrollbar-width: none; }
  .city-nav::-webkit-scrollbar { display: none; }
  .city-tab { display: flex; flex-direction: column; align-items: center; padding: 12px 20px; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.2s; min-width: 90px; gap: 2px; }
  .city-tab.active { border-bottom-color: var(--navy); }
  .ct-flag { font-size: 18px; margin-bottom: 2px; }
  .ct-name { font-size: 13px; font-weight: 700; color: var(--gray-700); }
  .city-tab.active .ct-name { color: var(--navy); }
  .ct-dates { font-size: 10px; color: var(--gray-400); }
  
  /* Tab Bar */
  .tab-bar { display: flex; gap: 12px; padding: 15px 30px; background: var(--white); border-bottom: 1px solid var(--gray-200); }
  .tab-pill { padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: 500; border: 1px solid var(--gray-200); background: var(--white); color: var(--gray-700); cursor: pointer; display: flex; align-items: center; gap: 6px; transition: 0.2s; white-space: nowrap; }
  .tab-pill.active { background: var(--navy); border-color: var(--navy); color: white; }

  /* Content Container */
  .content { padding: 25px 30px; flex: 1; max-width: 1200px; margin: 0 auto; width: 100%; }
  
  /* Blue Info Banner */
  .info-banner { background: var(--navy); color: white; padding: 20px 25px; border-radius: var(--radius); margin-bottom: 35px; }
  .info-banner h3 { font-size: 18px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .info-banner p { font-size: 13px; line-height: 1.6; color: rgba(255,255,255,0.9); }
  
  /* Sections Config */
  .section-container { margin-bottom: 35px; }
  .section-title { font-size: 11px; font-weight: 700; color: var(--gray-400); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
  
  /* Airport Box (Borda dourada esquerda) */
  .airport-box { border-left: 3px solid var(--gold); padding: 5px 0 5px 15px; font-size: 13px; line-height: 1.6; color: var(--gray-700); margin-left: 5px; }
  
  /* TIP Rows */
  .tip-row { display: flex; align-items: flex-start; gap: 15px; margin-bottom: 18px; }
  .badge-tip { background: var(--navy); color: white; border-radius: 12px; padding: 4px 14px; font-size: 11px; font-weight: 700; line-height: 1.2; margin-top: 2px; }
  .badge-day { background: var(--gray-700); color: white; border-radius: 12px; padding: 4px 14px; font-size: 11px; font-weight: 700; line-height: 1.2; margin-top: 2px; min-width: 55px; text-align: center; }
  .tip-text { font-size: 13px; line-height: 1.6; color: var(--gray-700); flex: 1; }
  
  /* Inputs */
  .day-input { flex: 1; border: none; border-bottom: 1px solid var(--gray-100); background: transparent; font-size: 13px; color: var(--gray-700); line-height: 1.6; outline: none; resize: vertical; min-height: 50px; width: 100%; font-family: inherit; padding-bottom: 10px; }
  .day-input:focus { border-bottom-color: var(--navy); }
  .notes-input { width: 100%; border: 1px solid var(--gray-200); border-radius: var(--radius); padding: 15px; font-size: 13px; color: var(--gray-700); min-height: 120px; background: var(--cream); resize: vertical; outline: none; font-family: inherit; line-height: 1.6; }
  
  /* Bottom Maps Footer */
  .bottom-maps-footer { background: var(--navy); color: white; padding: 15px 30px; text-decoration: none; font-size: 13px; font-weight: 700; display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-top: auto; transition: background 0.2s; }
  .bottom-maps-footer:hover { background: var(--navy-light); }

  /* Responsividade */
  @media (max-width: 768px) {
    .app-header { padding: 15px 20px; }
    .tab-bar { padding: 12px 20px; overflow-x: auto; }
    .content { padding: 20px; }
    .tip-row { gap: 10px; }
    .bottom-maps-footer { justify-content: center; padding: 15px; }
  }
</style>
</head>

const storage = {
  get(key){ try{ return JSON.parse(localStorage.getItem(key)); }catch(e){ return null; } },
  set(key,val){ try{ localStorage.setItem(key,JSON.stringify(val)); }catch(e){} }
};

const dayPlans = {};
const notes = {};
cities.forEach(c => {
  const savedDays = storage.get('days_'+c.id);
  dayPlans[c.id] = savedDays || [...c.dayDefaults];
  notes[c.id] = storage.get('notes_'+c.id) || c.notesDefault || '';
});

let activeCity = 0;
let activeTab = 'roteiro';

function mapsUrl(query, city){ return `https://www.google.com/maps/search/${encodeURIComponent(query + ' ' + city.name + ' ' + city.country)}`; }
function cityMapsUrl(city){ return `https://www.google.com/maps/search/${encodeURIComponent(city.mapQ)}`; }

// Exibe as Bandeiras no menu superior
function renderNav(){
  const nav = document.getElementById('cityNav');
  nav.innerHTML = cities.map((c,i) => `
    <div class="city-tab ${i===activeCity?'active':''}" onclick="selectCity(${i})">
      <span class="ct-flag">${c.flag}</span>
      <span class="ct-name">${c.name}</span>
      <span class="ct-dates">${c.dates}</span>
    </div>
  `).join('');
}

function selectCity(i){ 
  activeCity = i; 
  renderNav(); 
  renderContent(); 
}

function setTab(tab, el){ 
  activeTab = tab; 
  document.querySelectorAll('.tab-pill').forEach(t => t.classList.remove('active')); 
  el.classList.add('active'); 
  renderContent(); 
}

function saveDayPlan(cityId, dayIndex, val) {
  dayPlans[cityId][dayIndex] = val;
  storage.set('days_' + cityId, dayPlans[cityId]);
}
function saveNote(cityId, val) {
  notes[cityId] = val;
  storage.set('notes_' + cityId, notes[cityId]);
}

  const container = document.getElementById('mainContent');
  const city = cities[activeCity];
  
  // Atualiza o Link Principal do Rodapé para a cidade selecionada
  const footerLink = document.getElementById('footerMapLink');
  if (footerLink) {
    footerLink.href = cityMapsUrl(city);
  }
  
  if (activeTab === 'roteiro') {
    // Renderiza a tela exata como no seu print (Dashboard completo do Roteiro)
    let html = `
      <div class="info-banner">
        <h3><span style="color: #f39c12;">📍</span> ${city.name}</h3>
        <p>${city.transport}</p>
      </div>

      <div class="section-container">
        <div class="section-title">
          <span style="font-size:14px;">🛫</span> AEROPORTO ➝ HOSPEDAGEM
        </div>
        <div class="airport-box">
          ${city.airportTransfer}
        </div>
      </div>

      <div class="section-container">
        <div class="section-title">
          <span style="font-size:14px;">🚇</span> TREM / METRÔ MAIS ÚTEIS
        </div>
        <div>
          ${city.trainTips.map(tip => `
            <div class="tip-row">
              <div class="badge-tip">TIP</div>
              <div class="tip-text">${tip}</div>
            </div>
          `).join('')}
        </div>
      </div>

      <div class="section-container">
        <div class="section-title">
          <span style="font-size:14px;">📋</span> PLANEJAMENTO DIÁRIO
        </div>
        <div>
          ${city.days.map((dayLabel, idx) => `
            <div class="tip-row">
              <div class="badge-day">${dayLabel}</div>
              <textarea class="day-input" onchange="saveDayPlan('${city.id}', ${idx}, this.value)">${dayPlans[city.id][idx] || ''}</textarea>
            </div>
          `).join('')}
        </div>
      </div>
    `;

    // Restaura as rotas do Google Maps diárias dentro do Roteiro
    if (city.mapRoutes && city.mapRoutes.length > 0) {
      html += `
        <div class="section-container">
          <div class="section-title">
            <span style="font-size:14px;">🗺️</span> ROTAS RECOMENDADAS NO MAPS
          </div>
          <div>
            ${city.mapRoutes.map(r => `
              <div class="tip-row">
                <div class="badge-day" style="background:var(--navy);">MAPA</div>
                <div class="tip-text">
                  <strong>${r.title}</strong><br>
                  <span style="font-size: 12px; color: var(--gray-400);">${r.desc}</span><br>
                  <a href="${mapsUrl(r.query, city)}" target="_blank" style="color: var(--navy); font-size: 12px; font-weight: bold; text-decoration: none; margin-top: 4px; display: inline-block;">Abrir Rota no Maps ↗</a>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    html += `
      <div class="section-container">
        <div class="section-title">
          <span style="font-size:14px;">📝</span> NOTAS DA CIDADE
        </div>
        <textarea class="notes-input" onchange="saveNote('${city.id}', this.value)">${notes[city.id] || ''}</textarea>
      </div>
    `;
    
    container.innerHTML = html;

  } else if (activeTab === 'turistico') {
    let html = `<div class="section-container"><div class="section-title">🏛 ATRAÇÕES E PASSEIOS</div>`;
    city.tourists.forEach(t => {
      html += `
        <div class="tip-row" style="align-items: center;">
          <span class="badge-tip" style="background:var(--cream); border:1px solid var(--gray-200); font-size: 16px; padding: 6px 10px;">${t.icon}</span>
          <div class="tip-text">
            <strong>${t.name}</strong><br>
            <span style="color: var(--gray-400); font-size: 12px;">${t.meta}</span><br>
            <a href="${mapsUrl(t.name, city)}" target="_blank" style="color: var(--navy); font-size: 12px; font-weight: bold; text-decoration: none;">Ver no Google Maps ↗</a>
          </div>
        </div>
      `;
    });
    html += `</div>`;
    container.innerHTML = html;
  } else if (activeTab === 'restaurantes') {
    let html = `<div class="section-container"><div class="section-title">🍽 RESTAURANTES E CAFÉS</div>`;
    city.restaurants.forEach(r => {
      html += `
        <div class="tip-row" style="align-items: center;">
          <span class="badge-tip" style="background:var(--cream); border:1px solid var(--gray-200); font-size: 16px; padding: 6px 10px;">${r.icon}</span>
          <div class="tip-text">
            <strong>${r.name}</strong><br>
            <span style="color: var(--gray-400); font-size: 12px;">${r.meta}</span><br>
            <a href="${mapsUrl(r.name, city)}" target="_blank" style="color: var(--navy); font-size: 12px; font-weight: bold; text-decoration: none;">Ver no Google Maps ↗</a>
          </div>
        </div>
      `;
    });
    html += `</div>`;
    container.innerHTML = html;
  } else if (activeTab === 'apoio') {
    let html = `
      <div class="section-container">
        <div class="section-title">
          <span style="font-size:14px;">🏠</span> INFORMAÇÕES DO ENDEREÇO
        </div>
        <div class="airport-box">
          <strong>Endereço:</strong> ${city.address}
        </div>
      </div>
    `;
    container.innerHTML = html;
  }
}

// Inicialização
renderNav();
renderContent();

// PWA: Registro do Service Worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js');
  });
}
</script>
</body>
</html>
