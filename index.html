  .place-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }

      'MANHÃ/TARDE: chegada e check-in. FIM DE TARDE: Galerie Vivienne, Palais-Royal e Opéra Garnier sem grandes deslocamentos. NOITE: jantar perto do Airbnb.',
      'MANHÃ: sair cedo para Disneyland Paris via RER A. TARDE: parque. NOITE: retorno para o 2º arrondissement.',
      '22/04 — MANHÃ: Louvre com ingresso já comprado. TARDE: Tuileries, Place de la Concorde e, se quiserem, Champs-Élysées. NOITE: jantar na região central.',
      'MANHÃ: Notre-Dame e Île de la Cité. TARDE: Conciergerie/Sainte-Chapelle e caminhada até o Marais. NOITE: jantar no Marais ou retorno ao 2º.',
      'MANHÃ: Torre Eiffel e Trocadéro OU Montmartre/Sacré-Cœur. TARDE: façam a segunda opção, se houver energia. NOITE: fechar a viagem com jantar especial.'
    ],
    tourists:[
      {name:'Galerie Vivienne', icon:'✨', meta:'bem perto da hospedagem'},
      {name:'Disneyland Paris', icon:'🏰', meta:'separar um dia inteiro'},
      {name:'Museu do Louvre', icon:'🖼️', meta:'visita fixada para 22/04'},
      {name:'Notre-Dame', icon:'⛪', meta:'combina com Île de la Cité'},
      {name:'Torre Eiffel', icon:'🗼', meta:'melhor no fim da tarde/noite'}
    ],
    restaurants:[
      {name:'Bouillon Chartier', icon:'🍲', meta:'clássico e com boa relação custo-benefício'},
      {name:'Bistrot Vivienne', icon:'🍷', meta:'ótimo na área do Airbnb'},
      {name:'Kodawari Ramen', icon:'🍜', meta:'boa opção no eixo central'}
    ],
    notesDefault:'O Louvre abre na quarta-feira até mais tarde e o dia 22/04 está bem encaixado. Para Disney, saiam cedo e confiram a operação do RER A na véspera.'
  },
  {
  id:'porto-final', name:'Porto Final', flag:'🇵🇹', country:'Portugal', dates:'25–26 abr', address:'Aeroporto do Porto',
  lat:41.1496, lng:-8.6109, mapQ:'Porto Airport Portugal',
  transport:'Trecho totalmente operacional dentro do aeroporto. Como a chegada será à noite e o voo para o Brasil sai às 10h da manhã seguinte, a melhor estratégia é permanecer no aeroporto e evitar qualquer deslocamento externo.',
  airportTransfer:'Não será necessário traslado. A chegada em Porto no dia 25/04 será seguida de permanência no próprio aeroporto até o embarque internacional na manhã de 26/04.',
  trainTips:[
    'Não há necessidade de trem, metrô ou táxi neste trecho final.',
    'A prioridade é localizar com antecedência o terminal, check-in e opções de café/descanso.'
  ],
  mapRoutes:[
    {title:'Mapa — Aeroporto do Porto', desc:'Visualização do aeroporto.', query:'Porto Airport Portugal'}
  ],
  days:['Dia 1','Dia 2'],
  dayDefaults:[
    'NOITE: chegada em Porto por volta das 22h e permanência no aeroporto para descanso e organização da viagem.',
    'MANHÃ: check-in e embarque para o Brasil às 10h.'
  ],
  tourists:[],
  restaurants:[],
  notesDefault:'Sem passeio externo. Trecho final apenas para descanso no aeroporto e embarque no dia seguinte.'
},
];

const storage = {
  get(key){ try{ return JSON.parse(localStorage.getItem(key)); }catch(e){ return null; } },
  set(key,val){ try{ localStorage.setItem(key,JSON.stringify(val)); }catch(e){} }
};

const dayPlans = {};
const notes = {};
cities.forEach(c => {
  const savedDays = storage.get('days_'+c.id);
  dayPlans[c.id] = savedDays || [...c.dayDefaults];
  notes[c.id] = storage.get('notes_'+c.id) || c.notesDefault || '';
});

let activeCity = 0;
let activeTab = 'roteiro';

function mapsUrl(query, city){
  return `https://www.google.com/maps/search/${encodeURIComponent(query + ' ' + city.name + ' ' + city.country)}`;
}
function cityMapsUrl(city){
  return `https://www.google.com/maps/search/${encodeURIComponent(city.mapQ)}`;
}
function renderNav(){
  const nav = document.getElementById('cityNav');
  nav.innerHTML = cities.map((c,i) => `
    <div class="city-tab ${i===activeCity?'active':''}" onclick="selectCity(${i})">
      <span class="ct-flag">${c.flag}</span>
      <span class="ct-name ${i===activeCity?'active-text':''}">${c.name}</span>
      <span class="ct-dates">${c.dates}</span>
    </div>
  `).join('');
}
function selectCity(i){ activeCity = i; renderNav(); renderContent(); window.scrollTo({top: document.querySelector('.city-nav').offsetTop - 60, behavior:'smooth'}); }
function setTab(tab, el){ activeTab = tab; document.querySelectorAll('.tab-pill').forEach(t => t.classList.remove('active')); el.classList.add('active'); renderContent(); }
function saveDayPlan(cityId, idx, val){ dayPlans[cityId][idx] = val; storage.set('days_'+cityId, dayPlans[cityId]); }
function saveNote(cityId, val){ notes[cityId] = val; storage.set('notes_'+cityId, val); }

function renderContent(){
  const city = cities[activeCity];
  const el = document.getElementById('mainContent');
  let html = '';

  if(activeTab === 'roteiro'){
    html += `<div class="transport-box"><h3>📍 ${city.name}</h3><p>${city.transport}</p></div>`;
    if(city.airportTransfer){
      html += `<div class="card"><div class="card-title">🚆 Aeroporto → hospedagem</div><div class="mini-note">${city.airportTransfer}</div></div>`;
    }
    if(city.trainTips && city.trainTips.length){
      html += `<div class="card"><div class="card-title">🚇 Trem / metrô mais úteis</div>${city.trainTips.map(t => `<div class="day-row"><span class="day-badge">TIP</span><div class="place-info"><div class="place-meta" style="font-size:13px;color:var(--gray-900)">${t}</div></div></div>`).join('')}</div>`;
    }
    html += `<div class="card">
      <div class="card-title">📆 Planejamento diário</div>
      ${city.days.map((day,i) => `
        <div class="day-row">
          <span class="day-badge">${day}</span>
          <textarea class="day-input" rows="3" onchange="saveDayPlan('${city.id}',${i},this.value)">${(dayPlans[city.id][i]||'').replace(/</g,'&lt;')}</textarea>
        </div>`).join('')}
    </div>`;
    html += `<div class="card">
      <div class="card-title">📝 Notas da cidade</div>
      <textarea class="notes-input" onchange="saveNote('${city.id}',this.value)">${notes[city.id].replace(/</g,'&lt;')}</textarea>
    </div>`;
    html += `<a class="maps-btn" href="${cityMapsUrl(city)}" target="_blank">🗺 Abrir base da cidade no Google Maps</a>`;
  }

  if(activeTab === 'turistico'){
    html += `<div class="card"><div class="card-title">🏛 Pontos turísticos sugeridos — ${city.name}</div>
      ${city.tourists.map(t => `
        <a class="place-item" href="${mapsUrl(t.name, city)}" target="_blank">
          <div class="place-icon pi-tourist">${t.icon}</div>
          <div class="place-info"><div class="place-name">${t.name}</div><div class="place-meta">${t.meta}</div><div class="place-link">Ver no Google Maps ↗</div></div>
        </a>`).join('')}
      <div class="mini-note">Os pontos foram organizados por blocos de deslocamento para evitar idas e vindas desnecessárias.</div>
    </div>`;
  }

  if(activeTab === 'restaurantes'){
    html += `<div class="card"><div class="card-title">🍽 Restaurantes / bares / paradas práticas — ${city.name}</div>
      ${city.restaurants.map(r => `
        <a class="place-item" href="${mapsUrl(r.name, city)}" target="_blank">
          <div class="place-icon pi-restaurant">${r.icon}</div>
          <div class="place-info"><div class="place-name">${r.name}</div><div class="place-meta">${r.meta}</div><div class="place-link">Ver no Google Maps ↗</div></div>
        </a>`).join('')}
    </div>`;
  }

  if(activeTab === 'apoio'){
    html += `<div class="card"><div class="card-title">🏠 Base da viagem — ${city.name}</div>
      <div class="place-item" style="cursor:default">
        <div class="place-icon pi-airbnb">🏠</div>
        <div class="place-info">
          <div class="place-name">${city.address}</div>
          <div class="place-meta">Endereço/base usado para organizar o roteiro e os mapas.</div>
        </div>
      </div>
      <a class="maps-btn" href="${cityMapsUrl(city)}" target="_blank">📍 Ver endereço/base no Google Maps</a>
    </div>`;
    if(city.mapRoutes && city.mapRoutes.length){
      html += `<div class="card"><div class="card-title">🗺 Mapas prontos entre os pontos</div>
      ${city.mapRoutes.map(m => `
        <a class="place-item" href="https://www.google.com/maps/search/${encodeURIComponent(m.query)}" target="_blank">
          <div class="place-icon pi-tourist">🗺️</div>
          <div class="place-info"><div class="place-name">${m.title}</div><div class="place-meta">${m.desc}</div><div class="place-link">Abrir rota/mapa ↗</div></div>
        </a>`).join('')}
      <div class="mini-note">Esses links servem para vocês visualizarem os pontos em conjunto no mapa e recalcularem a ordem conforme clima, fila e energia do dia.</div></div>`;
    }
  }

  el.innerHTML = html;
}
renderNav();
renderContent();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js").catch((error) => {
      console.error("Falha ao registrar service worker:", error);
    });
  });
}
</script>

</body>
</html>
